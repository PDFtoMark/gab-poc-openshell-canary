name: Release Canary PoC

on:
  workflow_run:
    workflows: ["Release Dev"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  canary:
    name: canary
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Provenance
        run: |
          echo "upstream_name=${{ github.event.workflow_run.name }}"
          echo "head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repository=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "downstream_token_perms=contents:read,actions:read"
      - name: Install and check status (same shape as OpenShell release-canary)
        run: |
          set -euo pipefail
          curl -LsSf "https://raw.githubusercontent.com/PDFtoMark/gab-poc-openshell-canary/${{ github.event.workflow_run.head_sha || github.sha }}/install.sh" | sh
